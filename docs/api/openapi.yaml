      type: object
      properties:
        executionTrace:
          type: boolean
          description: Whether events include the transformation pipeline execution trace
        purgeExecution:
          type: boolean
          description: Whether purge state triggers event removal
        storeEvents:
          type: boolean
          description: Whether events are stored
        storeEventsKeyHistory:
