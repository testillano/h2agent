openapi: 3.1.0
info:
  title: h2agent Management API
  description: |
    REST API to manage h2agent mock behavior for HTTP/2 traffic testing.
    All operations are served under the `/admin/v2/` base path on the
    management port (default 8074).
  version: "1.0"
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: h2agent
    url: https://github.com/testillano/h2agent

servers:
  - url: http://localhost:8074
    description: Default management endpoint

tags:
  - name: api-schema
    description: Json schemas of the admin resources
  - name: schema
    description: Validation schemas management
  - name: vault
    description: Vaults management
  - name: files
    description: Processed files information
  - name: logging
    description: Logging configuration
  - name: configuration
    description: General and server configuration
  - name: server-matching
    description: Traffic server matching configuration
  - name: server-provision
    description: Traffic server provision configuration
  - name: server-data
    description: Traffic server data storage
  - name: client-endpoint
    description: Client endpoints configuration
  - name: client-provision
    description: Client provision configuration
  - name: client-data
    description: Client data storage

paths:
  # ===== GENERAL =====

  /admin/v2/api-schema:
    get:
      tags: [api-schema]
      summary: List the admin resources with a published json schema
      responses:
        '200':
          description: Resource names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  enum: [server-matching, server-provision, client-endpoint, client-provision, schema, vault]

  /admin/v2/api-schema/{resource}:
    get:
      tags: [api-schema]
      summary: Retrieve the json schema of an admin resource
      description: >
        Json schema the agent validates the resource admin requests against (the
        provision schemas include the transformation grammar). '$id' is set to the
        request URI. The former /admin/v2/<resource>/schema paths answer 410 Gone.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [server-matching, server-provision, client-endpoint, client-provision, schema, vault]
      responses:
        '200':
          description: Schema definition retrieved
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Unknown resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'

  /admin/v2/schema:
    post:
      tags: [schema]
      summary: Load validation schema(s)
      description: >
        Loads schema(s) for future event validation. Schemas can be
        referenced within provision configurations by their string
        identifier. Accepts a single object or an array for bulk load.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SchemaConfig'
                - type: array
                  items:
                    $ref: '#/components/schemas/SchemaConfig'
      responses:
        '201':
          description: Schema(s) created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
    get:
      tags: [schema]
      summary: Retrieve all configured schemas
      responses:
        '200':
          description: Schemas retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchemaConfig'
        '204':
          description: No schemas configured
    delete:
      tags: [schema]
      summary: Delete all schemas
      responses:
        '200':
          description: Schemas deleted
        '204':
          description: No schemas to delete

  /admin/v2/vault:
    post:
      tags: [vault]
      summary: Load vaults
      description: >
        Creates or updates vaults. Variables are string-valued
        and interpreted as numbers or other types depending on the
        transformation involved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultMap'
      responses:
        '201':
          description: Variables created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
    get:
      tags: [vault]
      summary: Retrieve vaults
      description: >
        Without query parameter returns all variables as a JSON object.
        With `name` parameter returns the specific variable value as
        plain string.
      parameters:
        - name: name
          in: query
          description: Variable name to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Variable(s) retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultMap'
            text/plain:
              schema:
                type: string
                description: Single variable value (when name parameter is used)
        '204':
          description: No variables stored
        '400':
          description: Bad request (invalid name)
    delete:
      tags: [vault]
      summary: Delete vaults
      description: >
        Deletes all vaults or a specific one when the `name`
        query parameter is provided.
      parameters:
        - name: name
          in: query
          description: Variable name to delete
          schema:
            type: string
      responses:
        '200':
          description: Variable(s) deleted
        '204':
          description: No variables to delete
        '400':
          description: Bad request

  /admin/v2/vault/{key}/wait:
    get:
      tags: [vault]
      summary: Block until a vault changes
      description: >
        Long-poll endpoint that blocks until the specified vault
        changes from its current value (any change) or reaches a specific
        target value. Returns immediately if the condition is already met.
      parameters:
        - name: key
          in: path
          required: true
          description: Vault name to watch
          schema:
            type: string
        - name: value
          in: query
          description: >
            Target value to wait for. When omitted, any change from the
            current value triggers return. Scalars are compared by their
            text (60 matches "60"); JSON objects/arrays are compared as JSON.
          schema:
            type: string
        - name: timeoutMs
          in: query
          description: Maximum wait time in milliseconds (capped at 300000)
          schema:
            type: integer
            default: 30000
      responses:
        '200':
          description: Condition met
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultWaitResponse'
        '408':
          description: Timeout — condition not met within the specified time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultWaitResponse'
        '429':
          description: Too many concurrent waiters (max 32)

  /admin/v2/files:
    get:
      tags: [files]
      summary: Retrieve processed files list
      responses:
        '200':
          description: Files list retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileInfo'
        '204':
          description: No files processed

  /admin/v2/files/configuration:
    get:
      tags: [files]
      summary: Retrieve files read-cache configuration
      responses:
        '200':
          description: Files configuration retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesConfiguration'
    put:
      tags: [files]
      summary: Enable or disable the files read cache
      parameters:
        - name: readCache
          in: query
          required: true
          schema:
            type: string
            enum: ['true', 'false']
          description: Enable (true) or disable (false) the read cache
      responses:
        '200':
          description: Files configuration updated
        '400':
          description: Missing or invalid readCache value

  /admin/v2/udp-sockets:
    get:
      tags: [data]
      summary: Retrieve the list of managed UDP write sockets
      responses:
        '200':
          description: UDP sockets list retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UdpSocketInfo'
        '204':
          description: No UDP sockets managed

  /admin/v2/malloc-trim:
    get:
      tags: [general]
      summary: Release free heap memory back to the system (malloc_trim)
      description: >
        Forces a glibc `malloc_trim(0)`, asking the allocator to return free
        heap memory to the operating system. Operational/diagnostic endpoint.
      responses:
        '200':
          description: Trim executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [memory released, nothing to release]

  /admin/v2/logging:
    get:
      tags: [logging]
      summary: Retrieve current logging level
      responses:
        '200':
          description: Current log level
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LogLevel'
    put:
      tags: [logging]
      summary: Change logging level
      parameters:
        - name: level
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/LogLevel'
      responses:
        '200':
          description: Log level updated
        '400':
          description: Invalid log level

  /admin/v2/health:
    get:
      tags: [health]
      summary: Health check for liveness and readiness probes
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy

  /admin/v2/configuration:
    get:
      tags: [configuration]
      summary: Retrieve general process configuration
      responses:
        '200':
          description: Configuration retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralConfiguration'

  /admin/v2/capabilities:
    get:
      tags: [configuration]
      summary: Retrieve capabilities (diagnostics)
      description: >
        Admin API version, program version and provision transformation grammar
        accepted by this binary. Diagnostics only: clients use the admin API
        version they were written for. Retired versions (e.g. /admin/v1/...)
        are answered with 410 Gone and a hint to the current one.
      responses:
        '200':
          description: Capabilities retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiVersion: { type: string, example: v2 }
                  programVersion: { type: string, example: v5.0.0 }
                  grammar: { type: string, example: v1 }

  /admin/v2/server/configuration:
    put:
      tags: [configuration]
      summary: Update server configuration
      description: >
        Controls request body reception and memory pre-reservation.
        Useful to optimize server processing when request body content
        is not needed by provisions.
      parameters:
        - name: receiveRequestBody
          in: query
          schema:
            type: boolean
        - name: preReserveRequestBody
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Configuration updated
        '400':
          description: Bad request
    get:
      tags: [configuration]
      summary: Retrieve server configuration
      responses:
        '200':
          description: Server configuration retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerConfiguration'

  # ===== SERVER MOCK =====

  /admin/v2/server-matching:
    post:
      tags: [server-matching]
      summary: Configure server matching algorithm
      description: >
        Defines the matching procedure for incoming receptions.
        Three algorithms available: FullMatching (direct key lookup),
        FullMatchingRegexReplace (regex transform then lookup),
        RegexMatching (sequential regex matching with priority).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerMatching'
      responses:
        '201':
          description: Matching configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
    get:
      tags: [server-matching]
      summary: Retrieve current server matching configuration
      responses:
        '200':
          description: Matching configuration retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerMatching'

  /admin/v2/server-provision:
    post:
      tags: [server-provision]
      summary: Configure server provision(s)
      description: >
        Defines response behavior for incoming requests matching
        conditions (method, uri) with programmable response (headers,
        code, body) and optional transformation pipeline. Accepts a
        single object or an array for bulk provisioning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ServerProvision'
                - type: array
                  items:
                    $ref: '#/components/schemas/ServerProvision'
      responses:
        '201':
          description: Provision(s) created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
    get:
      tags: [server-provision]
      summary: Retrieve all server provisions
      responses:
        '200':
          description: Provisions retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServerProvision'
        '204':
          description: No provisions configured
    delete:
      tags: [server-provision]
      summary: Delete all server provisions
      responses:
        '200':
          description: Provisions deleted
        '204':
          description: No provisions to delete

  /admin/v2/server-provision/unused:
    get:
      tags: [server-provision]
      summary: Retrieve unused server provisions
      description: >
        Returns provisions that have not been matched yet. Useful for
        troubleshooting unnecessary provisions during test development.
      responses:
        '200':
          description: Unused provisions retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServerProvision'
        '204':
          description: No unused provisions

  /admin/v2/server-data/configuration:
    put:
      tags: [server-data]
      summary: Update server data storage configuration
      description: >
        Controls event storage behavior. Valid combinations:
        discard=true&discardKeyHistory=true (nothing stored),
        discard=false&discardKeyHistory=true (last event per key only),
        discard=false&discardKeyHistory=false (full history).
        disablePurge controls purge execution independently, and executionTrace the
        storage of the transformation pipeline trace in each event.
      parameters:
        - name: discard
          in: query
          schema:
            type: boolean
        - name: discardKeyHistory
          in: query
          schema:
            type: boolean
        - name: disablePurge
          in: query
          schema:
            type: boolean
        - name: executionTrace
          in: query
          description: Store the transformation pipeline execution trace in each event ('executionTrace' array)
          schema:
            type: boolean
      responses:
        '200':
          description: Configuration updated
        '400':
          description: Invalid combination (discard=true with discardKeyHistory=false)
    get:
      tags: [server-data]
      summary: Retrieve server data storage configuration
      responses:
        '200':
          description: Configuration retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataStorageConfiguration'

  /admin/v2/server-data:
    get:
      tags: [server-data]
      summary: Retrieve server data events
      description: >
        Returns stored server events. Without parameters returns all data.
        Filter by requestMethod+requestUri, optionally narrow with
        eventNumber and eventPath. URI parameter may need URL-encoding
        if it contains query parameters.
      parameters:
        - name: requestMethod
          in: query
          description: HTTP method filter (must be provided with requestUri)
          schema:
            type: string
            enum: [POST, GET, PUT, DELETE, HEAD]
        - name: requestUri
          in: query
          description: Request URI filter (URL-encoded if contains query params)
          schema:
            type: string
        - name: eventNumber
          in: query
          description: "Event position: 1..N chronological, -1..-N reverse"
          schema:
            type: integer
        - name: eventPath
          in: query
          description: JSON pointer path within the selected event
          schema:
            type: string
        - name: requestUriStartsWith
          in: query
          description: >
            Literal URI prefix instead of requestUri (which is then ignored), as in the serverEvent source: selects among all events of requestMethod whose URI starts with it, merged in reception order. Requires requestMethod and eventNumber. Returns the single event (or eventPath node).
          schema:
            type: string
        - name: recvseq
          in: query
          description: >
            Receive sequence within the requestMethod+requestUri key (both required), as in the serverEvent source; eventNumber is ignored. Returns the single event (or eventPath node).
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Data retrieved
          content:
            application/json:
              schema: {}
        '204':
          description: No data found
        '400':
          description: Bad request (incomplete parameters)
    delete:
      tags: [server-data]
      summary: Delete server data events
      description: >
        Deletes stored events. Without parameters deletes all.
        Filter with requestMethod+requestUri, optionally eventNumber.
      parameters:
        - name: requestMethod
          in: query
          schema:
            type: string
            enum: [POST, GET, PUT, DELETE, HEAD]
        - name: requestUri
          in: query
          schema:
            type: string
        - name: eventNumber
          in: query
          schema:
            type: integer
        - name: recvseq
          in: query
          description: >
            Receive sequence of the event to delete (requestMethod and requestUri required; eventNumber ignored). requestUriStartsWith is not accepted for deletion (400).
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Data deleted
        '204':
          description: No data to delete
        '400':
          description: Bad request

  /admin/v2/server-data/summary:
    get:
      tags: [server-data]
      summary: Retrieve server data summary
      description: >
        Returns summary information about stored events including
        total keys, total events, and a limited list of displayed keys.
      parameters:
        - name: maxKeys
          in: query
          description: Maximum number of keys to display
          schema:
            type: integer
      responses:
        '200':
          description: Summary retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerDataSummary'

  /admin/v2/server-data/sequence:
    get:
      tags: [data]
      summary: Retrieve server event sequence (time-ordered)
      description: >
        Returns a flat, time-ordered list of stored server events, optionally
        filtered by timestamp window, request method and/or a URI regex.
      parameters:
        - name: fromTimestampUs
          in: query
          schema: { type: integer, format: int64 }
          description: Lower bound (microseconds epoch), inclusive
        - name: toTimestampUs
          in: query
          schema: { type: integer, format: int64 }
          description: Upper bound (microseconds epoch), inclusive
        - name: requestMethod
          in: query
          schema: { type: string }
          description: Filter by request method
        - name: uriRegex
          in: query
          schema: { type: string }
          description: Filter events whose URI matches this regex
      responses:
        '200':
          description: Sequence retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSequence'
        '204':
          description: No matching events
        '400':
          description: Invalid uriRegex

  # ===== CLIENT MOCK =====

  /admin/v2/client-endpoint:
    post:
      tags: [client-endpoint]
      summary: Define client endpoint(s)
      description: >
        Defines client endpoint with remote server connection info.
        Endpoints connect on creation (unless lazy mode). Accepts a
        single object or an array for bulk configuration. Updating
        host/port/secure on existing id returns 202 and reconnects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ClientEndpoint'
                - type: array
                  items:
                    $ref: '#/components/schemas/ClientEndpoint'
      responses:
        '201':
          description: Endpoint(s) created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '202':
          description: Endpoint updated (connection re-created)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
    get:
      tags: [client-endpoint]
      summary: Retrieve client endpoints
      description: >
        Returns all configured client endpoints with an additional
        status field indicating current connection status.
      responses:
        '200':
          description: Endpoints retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientEndpoint'
        '204':
          description: No endpoints configured
    delete:
      tags: [client-endpoint]
      summary: Delete all client endpoints
      description: All connections will be closed and endpoints removed.
      responses:
        '200':
          description: Endpoints deleted
        '204':
          description: No endpoints to delete

  /admin/v2/client-provision:
    post:
      tags: [client-provision]
      summary: Configure client provision(s)
      description: >
        Defines client request behavior identified by mandatory `id`
        and optional `inState`. Includes request configuration,
        transformation pipeline (pre-send and on-response), endpoint
        selection, delays and timeouts. Accepts single or array.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ClientProvision'
                - type: array
                  items:
                    $ref: '#/components/schemas/ClientProvision'
      responses:
        '201':
          description: Provision(s) created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
    get:
      tags: [client-provision]
      summary: Retrieve all client provisions
      responses:
        '200':
          description: Provisions retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientProvision'
        '204':
          description: No provisions configured
    delete:
      tags: [client-provision]
      summary: Delete all client provisions
      responses:
        '200':
          description: Provisions deleted
        '202':
          description: Accepted
        '204':
          description: No provisions to delete

  /admin/v2/client-provision/unused:
    get:
      tags: [client-provision]
      summary: Retrieve unused client provisions
      description: >
        Returns provisions not yet triggered. Useful for troubleshooting.
      responses:
        '200':
          description: Unused provisions retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientProvision'
        '204':
          description: No unused provisions

  /admin/v2/client-provision/{id}/trigger:
    post:
      tags: [client-provision]
      summary: Trigger client provision
      description: >
        Triggers a client provision by its identifier (no request body: options go
        in the query). The former GET /admin/v2/client-provision/{id} answers 410
        Gone. Without extra
        query parameters, sends a single request with sequence=0.
        With sequenceBegin/sequenceEnd/cps, triggers multiple requests
        at the specified rate for load testing.
      parameters:
        - name: id
          in: path
          required: true
          description: Client provision identifier
          schema:
            type: string
        - name: inState
          in: query
          description: Initial state (defaults to "initial")
          schema:
            type: string
        - name: sequence
          in: query
          description: >
            Synchronous single-shot sequence value. Exclusive with
            sequenceBegin/sequenceEnd/cps/repeat.
          schema:
            type: integer
        - name: sequenceBegin
          in: query
          description: Start of sequence range
          schema:
            type: integer
        - name: sequenceEnd
          in: query
          description: End of sequence range
          schema:
            type: integer
        - name: cps
          in: query
          description: "Calls per second (0 to stop)"
          schema:
            type: integer
            minimum: 0
        - name: repeat
          in: query
          description: Repeat range once exhausted
          schema:
            type: boolean
      responses:
        '200':
          description: Single request triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '202':
          description: Multiple requests triggered (range mode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '404':
          description: Provision not found

  /admin/v2/client-data/configuration:
    put:
      tags: [client-data]
      summary: Update client data storage configuration
      description: >
        Same storage behavior as server-data configuration. Key includes
        clientEndpointId in addition to method and uri. Purge operates
        over provision id and current sequence.
      parameters:
        - name: discard
          in: query
          schema:
            type: boolean
        - name: discardKeyHistory
          in: query
          schema:
            type: boolean
        - name: disablePurge
          in: query
          schema:
            type: boolean
        - name: executionTrace
          in: query
          description: Store the transformation pipeline execution trace in each event ('executionTrace' array)
          schema:
            type: boolean
      responses:
        '200':
          description: Configuration updated
        '400':
          description: Invalid combination
    get:
      tags: [client-data]
      summary: Retrieve client data storage configuration
      responses:
        '200':
          description: Configuration retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataStorageConfiguration'

  /admin/v2/client/dispatch-latency:
    get:
      tags: [client]
      summary: Retrieve worker pool dispatch latency statistics
      description: >
        Returns accumulated statistics about the time between posting work
        to the client worker pool and the worker starting execution. This
        measures queue wait time + thread wakeup overhead. Useful to detect
        pool saturation.


        Interpretation:

        - avgUs < 50: pool idle, workers waiting for work. Ideal.

        - avgUs 100-500: pool busy but healthy. No significant queuing.

        - avgUs 1000-5000: pool at capacity. Work queues up. Consider adding workers.

        - avgUs > 10000: pool saturated. Workers cannot keep up. Add threads or reduce per-request cost.
      responses:
        '200':
          description: Dispatch latency statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  avgUs:
                    type: number
                    description: Average dispatch latency in microseconds
                  maxUs:
                    type: integer
                    description: Maximum dispatch latency in microseconds
                  count:
                    type: integer
                    description: Total number of dispatches measured
                  pending:
                    type: integer
                    description: Current number of dispatches waiting in the pool queue
                  discarded:
                    type: integer
                    description: Total ticks discarded due to pool congestion (--traffic-client-pool-max-pending)

  /admin/v2/client-data:
    get:
      tags: [client-data]
      summary: Retrieve client data events
      description: >
        Returns stored client events. Without parameters returns all.
        Filter by clientEndpointId+requestMethod+requestUri (all three
        required together), optionally narrow with eventNumber and
        eventPath.
      parameters:
        - name: clientEndpointId
          in: query
          description: Client endpoint identifier
          schema:
            type: string
        - name: requestMethod
          in: query
          schema:
            type: string
            enum: [POST, GET, PUT, DELETE, HEAD]
        - name: requestUri
          in: query
          description: Request URI (URL-encoded if contains query params)
          schema:
            type: string
        - name: eventNumber
          in: query
          description: "Event position: 1..N chronological, -1..-N reverse"
          schema:
            type: integer
        - name: eventPath
          in: query
          description: JSON pointer path within the selected event
          schema:
            type: string
        - name: requestUriStartsWith
          in: query
          description: >
            Literal URI prefix instead of requestUri (which is then ignored), as in the clientEvent source: selects among all events of clientEndpointId+requestMethod whose URI starts with it, merged in sending order. Requires clientEndpointId, requestMethod and eventNumber. Returns the single event (or eventPath node).
          schema:
            type: string
        - name: sendseq
          in: query
          description: >
            Send sequence within the clientEndpointId+requestMethod+requestUri key (all required), as in the clientEvent source; eventNumber is ignored. Returns the single event (or eventPath node).
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Data retrieved
          content:
            application/json:
              schema: {}
        '204':
          description: No data found
        '400':
          description: Bad request (incomplete parameters)
    delete:
      tags: [client-data]
      summary: Delete client data events
      description: >
        Deletes stored events. Without parameters deletes all.
        Filter with clientEndpointId+requestMethod+requestUri,
        optionally eventNumber.
      parameters:
        - name: clientEndpointId
          in: query
          schema:
            type: string
        - name: requestMethod
          in: query
          schema:
            type: string
            enum: [POST, GET, PUT, DELETE, HEAD]
        - name: requestUri
          in: query
          schema:
            type: string
        - name: eventNumber
          in: query
          schema:
            type: integer
        - name: sendseq
          in: query
          description: >
            Send sequence of the event to delete (clientEndpointId, requestMethod and requestUri required; eventNumber ignored). requestUriStartsWith is not accepted for deletion (400).
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Data deleted
        '204':
          description: No data to delete
        '400':
          description: Bad request

  /admin/v2/client-data/summary:
    get:
      tags: [client-data]
      summary: Retrieve client data summary
      description: >
        Returns summary with total keys, total events, and a limited
        list of displayed keys (clientEndpointId/method/uri).
      parameters:
        - name: maxKeys
          in: query
          description: Maximum number of keys to display
          schema:
            type: integer
      responses:
        '200':
          description: Summary retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDataSummary'

  /admin/v2/client-data/sequence:
    get:
      tags: [data]
      summary: Retrieve client event sequence (time-ordered)
      description: >
        Returns a flat, time-ordered list of stored client events, optionally
        filtered by timestamp window, request method and/or a URI regex.
      parameters:
        - name: fromTimestampUs
          in: query
          schema: { type: integer, format: int64 }
          description: Lower bound (microseconds epoch), inclusive
        - name: toTimestampUs
          in: query
          schema: { type: integer, format: int64 }
          description: Upper bound (microseconds epoch), inclusive
        - name: requestMethod
          in: query
          schema: { type: string }
          description: Filter by request method
        - name: uriRegex
          in: query
          schema: { type: string }
          description: Filter events whose URI matches this regex
      responses:
        '200':
          description: Sequence retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSequence'
        '204':
          description: No matching events
        '400':
          description: Invalid uriRegex


components:
  schemas:
    ResultResponse:
      type: object
      properties:
        result:
          type: boolean
        response:
          type: string

    SchemaConfig:
      type: object
      required: [id, schema]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Schema unique identifier (overwritten if exists)
        schema:
          type: object
          description: JSON Schema definition content

    VaultMap:
      type: object
      description: Key-value pairs (keys must not contain dots)
      additionalProperties: false
      patternProperties:
        ^[^.]+$: {}

    VaultWaitResponse:
      type: object
      properties:
        result:
          type: boolean
          description: Whether the wait condition was met
        key:
          type: string
          description: Variable name watched
        value:
          type: string
          description: Current variable value
        previousValue:
          type: string
          description: Variable value captured before waiting

    FileInfo:
      type: object
      properties:
        path:
          type: string
        bytes:
          type: integer
          description: Present when the file exists
        state:
          type: string
          enum: [opened, closed, missing]
        readCache:
          type: string
          enum: ['true']
          description: Present only when this file was served from the read cache

    FilesConfiguration:
      type: object
      properties:
        readCache:
          type: string
          enum: [enabled, disabled]

    UdpSocketInfo:
      type: object
      properties:
        path:
          type: string
        socket:
          type: integer
          description: Underlying socket descriptor

    EventSequence:
      type: array
      description: Time-ordered list of mock events
      items:
        type: object
        properties:
          direction:
            type: string
          method:
            type: string
          uri:
            type: string
          timestampUs:
            type: integer
            format: int64
          clientProvisionId:
            type: string
            description: Present on client events triggered by a client provision

    LogLevel:
      type: string
      enum:
        - Debug
        - Informational
        - Notice
        - Warning
        - Error
        - Critical
        - Alert
        - Emergency

    GeneralConfiguration:
      type: object
      properties:
        longTermFilesCloseDelayUsecs:
          type: integer
        shortTermFilesCloseDelayUsecs:
          type: integer
        lazyClientConnection:
          type: boolean

    ServerConfiguration:
      type: object
      properties:
        preReserveRequestBody:
          type: boolean
        receiveRequestBody:
          type: boolean

    ServerMatching:
      type: object
      required: [algorithm]
      additionalProperties: false
      properties:
        algorithm:
          type: string
          enum: [FullMatching, FullMatchingRegexReplace, RegexMatching]
          description: >
            FullMatching: direct key lookup (default, best performance).
            FullMatchingRegexReplace: regex transform then lookup (requires rgx+fmt).
            RegexMatching: sequential regex matching with priority order.
        rgx:
          type: string
          description: Regex pattern (required for FullMatchingRegexReplace)
        fmt:
          type: string
          description: Format specifier for regex replace (required for FullMatchingRegexReplace)
        uriPathQueryParameters:
          type: object
          additionalProperties: false
          properties:
            filter:
              type: string
              enum: [Sort, PassBy, Ignore]
              description: >
                Sort (default): sorts query parameters for predictable matching.
                PassBy: uses query parameters as received.
                Ignore: removes query parameters from classification.
            separator:
              type: string
              enum: [Ampersand, Semicolon]
              description: "Query parameter separator (default: Ampersand)"
          required: [filter]

    TransformFilter:
      oneOf:
      - additionalProperties: false
        properties:
          op:
            enum:
            - regexCapture
            type: string
          rgx:
            type: string
        required:
        - op
        - rgx
        type: object
      - additionalProperties: false
        properties:
          fmt:
            type: string
          op:
            enum:
            - regexReplace
            type: string
          rgx:
            type: string
        required:
        - op
        - rgx
        - fmt
        type: object
      - additionalProperties: false
        properties:
