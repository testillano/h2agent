    ClientProvision:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^[^#]*$'
          description: Client provision identifier
        inState:
          type: string
          pattern: '^[^#]*$'
          description: "Input state for scenario FSM (default: 'initial')"
        outState:
          type: string
          pattern: '^[^#]*$'
          not:
            enum: [initial]
          description: "Output state (default: 'road-closed'). Cannot be 'initial'. Use 'purge' to clean scenario history."
        endpoint:
          type: string
          pattern: '^[^#]*$'
          description: Client endpoint identifier to use
        requestMethod:
          type: string
          enum: [POST, GET, PUT, DELETE, HEAD]
        requestUri:
          type: string
          description: Request URI template (typically completed by transformations)
        requestSchemaId:
          type: string
          description: Schema id to validate built request body
        requestHeaders:
          type: object
          additionalProperties:
            type: string
        requestBody:
          description: Request body template (any JSON type)
          anyOf:
            - type: object
            - type: array
            - type: string
            - type: integer
            - type: number
            - type: boolean
            - type: 'null'
        requestDelayMs:
          type: integer
          description: Delay before sending in milliseconds
        timeoutMs:
          type: integer
          description: Response timeout in milliseconds
        expectedResponseStatusCode:
          type: integer
          minimum: 100
          maximum: 599
          description: >
            Expected HTTP response status code. When set, a received status code
            other than this is accounted as an unexpected response.
        responseSchemaId:
          type: string
          description: Schema id to validate received response body
        transform:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ClientRequestTransformItem'
          description: Transformations applied before sending the request
        onResponseTransform:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ClientResponseTransformItem'
          description: Transformations applied after receiving the response

